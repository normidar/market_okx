name: market_okx
description: A Dart package for accessing OKX exchange market data including instruments, OHLCV candles, and multiple timeframes. Part of the Coin Galaxy ecosystem.
version: 0.0.1
homepage: https://github.com/normidar/market_okx
repository: https://github.com/normidar/market_okx
issue_tracker: https://github.com/normidar/market_okx/issues

environment:
  sdk: ^3.0.0

dependencies:
  decimal: ^3.0.0
  finance_kline_core: ^0.0.4
  http: ^1.2.0
  market_interface: ^0.0.2

dev_dependencies:
  auto_exporter: ^4.0.0
  build_runner: ^2.6.0
  test: ^1.24.0
  very_good_analysis: any

topics:
  - okx
  - market
  - exchange
  - trading
  - api
